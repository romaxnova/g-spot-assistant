name: CI
# Every push and pull request of a public copy is type-checked, tested and built as the Docker image Railway
# deploys. In a private copy (whose plan may not start Actions) the jobs are skipped unless started by hand
# from the Actions tab; changes there are checked on a clean checkout before they are pushed.
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Memory stays flat over 300 rounds of the calls Claude makes, with the allocator settings of the image.
      - run: npm run soak -- 300
        env:
          MALLOC_ARENA_MAX: '2'
          MALLOC_MMAP_THRESHOLD_: '131072'
          MALLOC_TRIM_THRESHOLD_: '131072'
  docker:
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t g-spot-assistant .
