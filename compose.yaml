# Runs G-Spot Assistant on any machine with Docker: copy .env.example to .env, fill it in, then
#   docker compose up -d
# The server listens on port 8080; put an HTTPS reverse proxy (Caddy, Traefik, a tunnel) in front of it,
# since Claude only connects to https addresses.
services:
  g-spot-assistant:
    build: .
    image: g-spot-assistant
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - g-spot-data:/data
volumes:
  g-spot-data:
